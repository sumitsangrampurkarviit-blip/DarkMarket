{% extends "base.html" %}

{% block title %}ADMIN LOGIN - SHADOW MARKET{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; margin-top: 4rem;">
    <div class="card" style="width: 400px; text-align: center;">
<pre style="color: var(--warning); margin-bottom: 2rem;">
┌─────────────────────────┐
│   ADMIN ACCESS ONLY     │
│   Enter credentials     │
└─────────────────────────┘
</pre>
        
        {% if error %}
        <p class="flash error" style="margin-bottom: 1rem;">{{ error }}</p>
        {% endif %}
        <form action="/admin/login" method="POST">
            <input type="password" name="password" placeholder="ENTER PASSWORD" required autofocus style="text-align: center; letter-spacing: 5px;">
            <button type="submit" class="btn" style="width: 100%;">LOGIN</button>
        </form>
    </div>
</div>
{% endblock %}
